<style>
  #dashboard-layout-options .layout-grid{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:18px;align-items:start}
  #dashboard-layout-options .choice{cursor:pointer;background:transparent;border:0;padding:0;text-align:left;color:var(--foreground)}
  #dashboard-layout-options .choice.is-selected .screen{box-shadow:0 0 0 3px var(--primary)}
  #dashboard-layout-options .screen{width:240px;height:320px;margin:auto;background:color-mix(in srgb,var(--background) 86%,var(--blue) 14%);color:var(--foreground);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-family:ui-monospace,monospace}
  #dashboard-layout-options .top{height:35px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--card) 80%,var(--blue) 20%);font-size:11px}
  #dashboard-layout-options .ok{color:var(--green)}
  #dashboard-layout-options .pad{padding:9px}
  #dashboard-layout-options .hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #dashboard-layout-options .temp{font-size:34px;color:var(--orange);line-height:1}
  #dashboard-layout-options .sub{font-size:9px;color:var(--muted-foreground);margin-top:4px}
  #dashboard-layout-options .ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) 0 58%,color-mix(in srgb,var(--border) 35%,transparent) 58% 100%);position:relative;font-size:11px}
  #dashboard-layout-options .ring:after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--background) 86%,var(--blue) 14%)}
  #dashboard-layout-options .ring span{z-index:1}
  #dashboard-layout-options .metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #dashboard-layout-options .metric{background:color-mix(in srgb,var(--card) 88%,transparent);padding:7px;border-radius:6px}
  #dashboard-layout-options .label{font-size:8px;color:var(--muted-foreground)}
  #dashboard-layout-options .value{font-size:16px;margin-top:3px}
  #dashboard-layout-options .bar{height:5px;margin-top:5px;background:color-mix(in srgb,var(--border) 45%,transparent);border-radius:4px;overflow:hidden}
  #dashboard-layout-options .fill{height:100%;background:var(--viz-series-1)}
  #dashboard-layout-options .status{margin-top:7px;padding:6px 8px;border-radius:6px;background:color-mix(in srgb,var(--green) 12%,transparent);font-size:9px;display:flex;justify-content:space-between}
  #dashboard-layout-options .chart-title{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px}
  #dashboard-layout-options .chart{height:70px;background:color-mix(in srgb,var(--card) 75%,transparent);border-radius:6px;padding:5px;margin-bottom:7px}
  #dashboard-layout-options .chart svg{width:100%;height:100%}
  #dashboard-layout-options .line{fill:none;stroke:var(--viz-series-1);stroke-width:2}
  #dashboard-layout-options .gridline{stroke:var(--border);stroke-width:.6}
  #dashboard-layout-options .rows{display:grid;gap:7px}
  #dashboard-layout-options .row{display:grid;grid-template-columns:55px 1fr 40px;gap:6px;align-items:center;font-size:9px}
  #dashboard-layout-options .row .value{text-align:right;font-size:11px}
  #dashboard-layout-options .big-status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
  #dashboard-layout-options .status-cell{padding:9px;background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:7px;text-align:center}
  #dashboard-layout-options .status-cell strong{display:block;font-size:13px;color:var(--green);margin-top:4px}
  #dashboard-layout-options h3{text-align:center;margin:10px 0 3px}
  #dashboard-layout-options .desc{text-align:center;color:var(--muted-foreground);font-size:12px;margin-bottom:10px}
  @media(max-width:820px){#dashboard-layout-options .layout-grid{grid-template-columns:1fr}}
</style>
<div id="dashboard-layout-options">
  <h2>选择环境仪表盘布局</h2>
  <p class="subtitle">三种方案都保留 Wi‑Fi 与 RS485 状态，事件到来时切换到单独的数据页。</p>
  <div class="layout-grid">
    <button class="choice" data-choice="a" onclick="toggleSelect(this)">
      <div class="screen">
        <div class="top"><span>ENVIRONMENT</span><span class="ok">● WIFI</span></div>
        <div class="pad">
          <div class="hero"><div><div class="label">TEMPERATURE</div><div class="temp">24.6°</div><div class="sub">舒适范围 18–26°C</div></div><div class="ring"><span>58%<br>RH</span></div></div>
          <div class="metrics">
            <div class="metric"><div class="label">PRESSURE</div><div class="value">1013</div><div class="sub">hPa</div></div>
            <div class="metric"><div class="label">LIGHT</div><div class="value">780</div><div class="sub">lux</div></div>
            <div class="metric"><div class="label">ALTITUDE</div><div class="value">42</div><div class="sub">m</div></div>
            <div class="metric"><div class="label">RS485</div><div class="value ok">LIVE</div><div class="sub">刚刚更新</div></div>
          </div>
          <div class="status"><span>773</span><span>192.168.5.47</span></div>
        </div>
      </div>
      <h3>A · 仪表卡片型</h3><div class="desc">温湿度最醒目，其他指标用卡片快速浏览</div>
    </button>
    <button class="choice" data-choice="b" onclick="toggleSelect(this)">
      <div class="screen">
        <div class="top"><span>ENVIRONMENT</span><span class="ok">● WIFI</span></div>
        <div class="pad">
          <div class="chart-title"><span>TEMPERATURE</span><strong>24.6°C</strong></div>
          <div class="chart"><svg viewBox="0 0 200 60" aria-label="温度趋势"><line class="gridline" x1="0" y1="15" x2="200" y2="15"/><line class="gridline" x1="0" y1="40" x2="200" y2="40"/><polyline class="line" points="0,42 25,38 50,40 75,28 100,31 125,20 150,24 175,15 200,18"/></svg></div>
          <div class="rows">
            <div class="row"><span>HUMIDITY</span><div class="bar"><div class="fill" style="width:58%"></div></div><span class="value">58%</span></div>
            <div class="row"><span>PRESSURE</span><div class="bar"><div class="fill" style="width:72%"></div></div><span class="value">1013</span></div>
            <div class="row"><span>LIGHT</span><div class="bar"><div class="fill" style="width:64%"></div></div><span class="value">780</span></div>
            <div class="row"><span>ALTITUDE</span><div class="bar"><div class="fill" style="width:32%"></div></div><span class="value">42m</span></div>
          </div>
          <div class="status"><span>RS485 ● LIVE</span><span>773 · 5.47</span></div>
        </div>
      </div>
      <h3>B · 趋势图型</h3><div class="desc">突出温度变化趋势，其他数据用进度条呈现</div>
    </button>
    <button class="choice" data-choice="c" onclick="toggleSelect(this)">
      <div class="screen">
        <div class="top"><span>ENVIRONMENT</span><span>15:32</span></div>
        <div class="pad">
          <div class="big-status">
            <div class="status-cell"><span class="label">WIFI</span><strong>ONLINE</strong><span class="sub">192.168.5.47</span></div>
            <div class="status-cell"><span class="label">RS485</span><strong>LIVE</strong><span class="sub">0.4s ago</span></div>
          </div>
          <div class="metric"><div class="label">TEMPERATURE</div><div class="temp">24.6°C</div><div class="bar"><div class="fill" style="width:62%"></div></div></div>
          <div class="metric" style="margin-top:7px"><div class="label">HUMIDITY</div><div class="value">58%</div><div class="bar"><div class="fill" style="width:58%"></div></div></div>
          <div class="metrics" style="margin-top:7px">
            <div class="metric"><div class="label">PRESSURE</div><div class="value">1013</div><div class="sub">hPa</div></div>
            <div class="metric"><div class="label">LIGHT</div><div class="value">780</div><div class="sub">lux</div></div>
          </div>
          <div class="status"><span>ALTITUDE</span><span>42 m</span></div>
        </div>
      </div>
      <h3>C · 状态优先型</h3><div class="desc">连接状态最突出，适合设备运行监控</div>
    </button>
  </div>
</div>
